services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: stat-record-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    container_name: stat-record-redis
    ports:
      - "6379:6379"
volumes:
  postgres-data:
